<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>bài 6</title>
</head>
<body>
<pre id="ketqua"></pre>
<script>
  let soDong;
  while (true) {
    soDong = +prompt(`Nhập kích thước bạn mong muốn(10-30) dòng`);
    if (soDong <= 0 || Number.isNaN(soDong)) {
      alert(`Nhập lại!`);
      continue;
    }
    break;
  }
  let n = soDong;
  let result = "";
  for (let i = 1; i < n / 2; i++) {
    let trai = " ".repeat(n / 2 - i);
    let sao = "*".repeat(2 * i - 1)
    let giua = " ".repeat(2 * (n / 2 - i) + 1);
    result += trai + sao + giua + sao + "\n"
  }
  for (let i = 0; i < n; i++) {
    let soSao = 2 * n - 2* i - 1;
    if (soSao <= 0) break;
    let trai = " ".repeat(i);
    result += trai + "*".repeat(soSao) + "\n";
  }
  document.getElementById("ketqua").innerText = result;
</script>
</body>
</html>
